<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Awesome Agentic Capacity Planning</title>
<meta name="description" content="Awesome Agentic Capacity Planning: a living map of research on the infrastructure demand of LLM agents, with an interactive map, three coding matrices and an open list of papers. Anyone can add a paper.">
<script>
  // Site settings. Fill these in once the suggestion worker is deployed (see HOSTING.md).
  try { if (JSON.parse(localStorage.getItem('wtrc-theme')) === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) { /* storage unavailable */ }
  window.SITE_CONFIG = {
    dataUrl: 'data.json',
    suggestEndpoint: 'https://research-map-suggestions.hayman-lotfy.workers.dev/suggest', // the suggestion Worker
    repo: 'HPMP-L/InteractiveMap', // GitHub repository of the site (shows the open suggestions)
    turnstileSiteKey: '0x4AAAAAAFgojCMqIdNrHP9S',     // required to send: Cloudflare Turnstile site key (anti-spam, no account for visitors)
    contact: ''               // optional e-mail address shown when sending is off, e.g. 'name@university.edu'
  };
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400&display=swap">
<style>
/* Layout: one sticky bar, then one view at a time (map canvas, three matrices, paper list, suggestions),
   with a side panel that shows whatever was clicked.
   Style: light and airy by default (white cards on a light grey page, near-black text), blue only for links and the
   main button, pill buttons, 18px cards; dark only when the visitor picks it with the moon button. */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --surface-2:#F5F5F7; --track:#E8E8ED; --field:#EDEDF0; --tab-on:#FFFFFF;
  --ink:#1D1D1F; --ink-2:#424245; --muted:#68686D;
  --rule:#E3E3E8; --rule-2:#D2D2D7;
  --accent:#0066CC; --accent-soft:#F0F0F3; --on-accent:#FFFFFF; --sel:#1D1D1F;
  --btn-pri-bg:#0071E3; --btn-pri-ink:#FFFFFF; --strong-bg:#1D1D1F; --strong-ink:#FFFFFF;
  --st-wt:#C7C7CC; --st-tr:#98989D; --st-rc:#636366; --st-dc:#1D1D1F; --eyebrow:#68686D;
  --heat-1:#F5F5F7; --heat-2:#EBEBEF; --heat-3:#DEDEE3; --heat-4:#CDCDD3;
  --tz-hatch:#1D1D1F17; --tz-line:#1D1D1F; --scrim:#0000004D; --u1:#86868B;
  --map-dot:#D2D2D7; --edge:#86868B; --lane:#86868B; --lane-exec:#FFFFFF; --lane-orch:#F9F9FB; --lane-char:#FFFFFF;
  --pub-bg:#E8F5EC; --pub-line:#248A3D; --lab-bg:#EEEEFB; --lab-line:#5856D6;
  --pre-bg:#FBEDE6; --pre-line:#C93400; --ws-bg:#F5EDFB; --ws-line:#AF52DE;
  --q-bg:#E8F2FE; --q-line:#0071E3; --q-ink:#003E80; --q-mark:#0071E3;
  /* section levels: box, text, subtitle, "opens matrix cells" dot. The top of a list stands out most and each level
     below fades toward the page: here dark chapters, lighter sub-chapters (never white, the colour of paper cards) */
  --sec-0:#2C2C2E; --sec-1:#545458; --sec-2:#8E8E93; --sec-3:#C7C7CC; --sec-4:#E5E5EA;
  --sec-0-ink:#FFFFFF; --sec-1-ink:#FFFFFF; --sec-2-ink:#1D1D1F; --sec-3-ink:#1D1D1F; --sec-4-ink:#1D1D1F;
  --sec-0-sub:#D1D1D6; --sec-1-sub:#E5E5EA; --sec-2-sub:#1D1D1F; --sec-3-sub:#3A3A3C; --sec-4-sub:#424245;
  --sec-0-dot:#64B5FF; --sec-1-dot:#8CC4FF; --sec-2-dot:#003E80; --sec-3-dot:#0058B9; --sec-4-dot:#0066CC;
  --note-bg:#FFFFFF; --hit:#FFCC00; --ok:#1D7A35; --bad:#D70015;
  --shadow:0 1px 2px #0000000A, 0 2px 8px #0000000D; --shadow-card:2px 4px 12px #00000014; --shadow-lg:0 4px 12px #0000000F, 0 20px 50px #0000001F;
  --seg-shadow:0 1px 3px #0000001F, 0 0 0 .5px #0000000A;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:var(--sans);
  --code:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --hdr-h:112px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1D1D1F; --surface-2:#2C2C2E; --track:#2C2C2E; --field:#2C2C2E; --tab-on:#5A5A5E;
  --ink:#F5F5F7; --ink-2:#D2D2D7; --muted:#A1A1A6;
  --rule:#38383A; --rule-2:#48484A;
  --accent:#2997FF; --accent-soft:#2C2C2E; --on-accent:#000000; --sel:#F5F5F7;
  --btn-pri-bg:#0071E3; --btn-pri-ink:#FFFFFF; --strong-bg:#F5F5F7; --strong-ink:#1D1D1F;
  --st-wt:#48484A; --st-tr:#6E6E73; --st-rc:#AEAEB2; --st-dc:#F5F5F7; --eyebrow:#A1A1A6;
  --heat-1:#1D1D1F; --heat-2:#262628; --heat-3:#303033; --heat-4:#3B3B3E;
  --tz-hatch:#F5F5F71A; --tz-line:#F5F5F7; --scrim:#000000A6; --u1:#7C7C80;
  --map-dot:#2C2C2E; --edge:#7C7C80; --lane:#86868B; --lane-exec:#000000; --lane-orch:#0E0E10; --lane-char:#000000;
  --pub-bg:#12261A; --pub-line:#30D158; --lab-bg:#1E1E33; --lab-line:#7D7AFF;
  --pre-bg:#2E2011; --pre-line:#FF9F0A; --ws-bg:#2A1A33; --ws-line:#BF5AF2;
  --q-bg:#0B2A4A; --q-line:#2997FF; --q-ink:#D6EAFF; --q-mark:#2997FF;
  --sec-0:#747479; --sec-1:#5A5A5E; --sec-2:#48484A; --sec-3:#3A3A3C; --sec-4:#2C2C2E;
  --sec-0-ink:#FFFFFF; --sec-1-ink:#FFFFFF; --sec-2-ink:#F5F5F7; --sec-3-ink:#F5F5F7; --sec-4-ink:#F5F5F7;
  --sec-0-sub:#FFFFFF; --sec-1-sub:#E5E5EA; --sec-2-sub:#D1D1D6; --sec-3-sub:#C7C7CC; --sec-4-sub:#C7C7CC;
  --sec-0-dot:#BFE0FF; --sec-1-dot:#8CC4FF; --sec-2-dot:#64B5FF; --sec-3-dot:#2997FF; --sec-4-dot:#2997FF;
  --note-bg:#1D1D1F; --hit:#FFD60A; --ok:#30D158; --bad:#FF6961;
  --shadow:0 1px 2px #00000080, 0 2px 8px #00000066; --shadow-card:0 0 0 1px #FFFFFF0F; --shadow-lg:0 4px 12px #00000080, 0 20px 50px #000000B3;
  --seg-shadow:0 1px 3px #00000080;
  color-scheme:dark; }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--sans); letter-spacing:-.01em; -webkit-font-smoothing:antialiased}
h1,h2,h3,.h2{font-optical-sizing:auto}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--surface)}
[hidden]{display:none!important}
a{color:var(--accent)}
button{font:inherit; color:inherit}
.sr{position:absolute; left:0; top:0; width:1px; height:1px; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px; margin-inline:auto}
.wrap.wide{max-width:1680px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn{display:inline-flex; align-items:center; gap:7px; font:500 14px/1 var(--sans); padding:10px 17px; border-radius:980px; border:1px solid var(--rule-2); background:var(--surface); color:var(--ink); cursor:pointer; text-decoration:none; white-space:nowrap; transition:background-color .15s,border-color .15s}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--btn-pri-bg); border-color:var(--btn-pri-bg); color:var(--btn-pri-ink)}
.btn.primary:hover{filter:brightness(.93)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--accent); padding-inline:8px}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{font-size:13px; padding:7px 13px; border-radius:980px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.kbd-hint{font:500 11px/1 var(--code); color:var(--muted)}

/* ---------- top bar ---------- */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:color-mix(in srgb,var(--surface) 82%,transparent); -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px); border-bottom:1px solid var(--rule)}
.top-in{display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:8px 20px; align-items:center; padding-block:12px 10px}
.brand{display:grid; gap:1px; min-width:0}
.brand a{font:600 22px/1.1 var(--display); color:var(--ink); text-decoration:none; letter-spacing:-.015em; white-space:nowrap}
.brand a .ch{font:600 13px/1 var(--sans); color:var(--muted); letter-spacing:.02em; margin-right:4px; vertical-align:2px}
.brand p{margin:0; font-size:12.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:440px} /* never widens the name's column at the expense of the search box */
.search{position:relative; justify-self:end; width:min(340px,100%)}
.search input{width:100%; font:14px/1.2 var(--sans); padding:10px 16px 10px 38px; border-radius:12px; border:1px solid transparent; background:var(--field); color:var(--ink)}
.search input:focus{background:var(--surface); border-color:var(--rule-2)}
.search svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:15px; height:15px; stroke:var(--muted); fill:none; stroke-width:2}
.search-res{position:absolute; right:0; top:calc(100% + 8px); width:min(420px,calc(100vw - 32px)); max-height:60vh; overflow:auto; background:var(--surface); border:1px solid var(--rule); border-radius:18px; box-shadow:var(--shadow-lg); z-index:50; padding:8px}
.search-res button{display:grid; gap:1px; width:100%; text-align:left; padding:9px 12px; border:0; border-radius:12px; background:none; cursor:pointer}
.search-res button:hover,.search-res button.on{background:var(--surface-2)}
.search-res .k{font:600 12px/1.3 var(--sans); color:var(--muted)}
.search-res .t{font-size:14px; color:var(--ink)}
.search-res .empty{padding:10px; color:var(--muted); font-size:14px; margin:0}
.tools{display:flex; gap:8px; align-items:center}
.tools .np-s{display:none}
.icon-btn{display:inline-grid; place-items:center; width:36px; height:36px; border-radius:50%; border:1px solid transparent; background:var(--field); cursor:pointer; color:var(--ink-2)}
.icon-btn:hover{background:var(--rule); color:var(--ink)}
.icon-btn svg{width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.8}
.tabs{grid-column:1/-1; justify-self:start; max-width:100%; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; margin-top:6px; padding:3px; background:var(--track); border-radius:11px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{position:relative; display:inline-flex; align-items:center; gap:7px; padding:8px 14px; font:500 13.5px/1 var(--sans); color:var(--ink-2); text-decoration:none; white-space:nowrap; border-radius:8px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink); font-weight:600; background:var(--tab-on); box-shadow:var(--seg-shadow)}
.tabs:empty{display:none}
.tabs .tn{font:600 11.5px/1 var(--sans); color:var(--muted)}
.tabs a[aria-current="page"] .tn{color:inherit}
@media (max-width:900px){ .brand p{display:none} .tabs a{padding-inline:10px} }
.tabs .sep{width:1px; background:var(--rule-2); margin:7px 4px}
.tabs .badge{font:700 11px/1 var(--sans); background:var(--strong-bg); color:var(--strong-ink); border-radius:999px; padding:3px 7px}
@media (max-width:760px){
  .top-in{grid-template-columns:minmax(0,1fr) auto}
  .brand p{display:none}
  .tools .np-l{display:none} .tools .np-s{display:inline}
  .brand a{display:block; overflow:hidden; text-overflow:ellipsis}
  .search{grid-column:1/-1; grid-row:3; width:100%; justify-self:stretch}
  .tabs{grid-row:2; flex-wrap:wrap; overflow:visible}
  .tabs .tl,.tabs .pc{display:none}
  .tabs .tn::before{content:"M"}
  .tabs a{padding-inline:8px}
  .tabs .sep{margin:7px 2px}
  .tabs .tn{font:inherit; color:inherit}
}

/* ---------- views ---------- */
.view{min-height:calc(100dvh - var(--hdr-h))}
.page{padding-block:28px 60px; display:grid; gap:8px}
.page > *{min-width:0}
.eyebrow{font:600 13px/1.4 var(--sans); color:var(--eyebrow); margin:0}
h1{font:600 clamp(30px,4.4vw,48px)/1.04 var(--display); letter-spacing:-.02em; margin:0; text-wrap:balance}
.lede{max-width:80ch; font-size:17px; color:var(--ink-2); margin:6px 0 0}
.lede b{color:var(--ink); font-weight:600}
.stats{display:flex; flex-wrap:wrap; gap:8px 26px; margin:10px 0 0; padding:0; list-style:none; font-variant-numeric:tabular-nums}
.stats li{display:flex; align-items:baseline; gap:7px; color:var(--ink-2); font-size:14px}
.stats strong{font:600 28px/1 var(--display); color:var(--ink)}
.secp{padding-block:22px 18px; display:grid; gap:14px}
.secp > *{min-width:0}
.h2{font:600 clamp(23px,2.8vw,31px)/1.15 var(--display); letter-spacing:-.012em; margin:0; text-wrap:balance}
.sec-p{margin:0; color:var(--ink-2); max-width:86ch}
.foot{margin-top:24px; padding-top:16px; border-top:1px solid var(--rule); font-size:13px; color:var(--muted); max-width:100ch}
.foot p{margin:0}
.ref{font:inherit; font-weight:500; color:var(--accent); background:none; border:0; border-radius:2px; padding:0; cursor:pointer; text-align:left; text-decoration:underline dotted 1px; text-underline-offset:3px}
.ref:hover{text-decoration-style:solid}
.ref.big{font:600 19px/1.25 var(--display); color:var(--ink); text-decoration:none}
.ref.big:hover{text-decoration:underline 1px; text-underline-offset:3px}
.edit-pen{opacity:0; transition:opacity .15s; border:0; background:none; cursor:pointer; color:var(--muted); padding:3px; border-radius:8px; line-height:0}
.edit-pen svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.8}
.edit-pen:hover{color:var(--accent); background:var(--accent-soft)}
:is(.tk,.fl-row,.card,.rule-box,.secp-head,.top-page):hover .edit-pen, .edit-pen:focus-visible{opacity:1}
@media (hover:none){ .edit-pen{opacity:.7} }
.secp-head{display:flex; gap:8px; align-items:baseline}

/* take-aways */
.tks{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
@media (max-width:1060px){ .tks{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:680px){ .tks{grid-template-columns:1fr} }
.tk{position:relative; background:var(--surface); border:1px solid var(--rule); border-radius:20px; padding:18px 20px; display:grid; gap:8px; align-content:start; min-width:0}
.tk .edit-pen{position:absolute; top:8px; right:8px}
.tk h3{font:600 17px/1.3 var(--display); margin:0; padding-right:18px; text-wrap:balance}
.tk p,.tk li{margin:0; font-size:14.5px; color:var(--ink-2)}
.tk ol{margin:0; padding-left:20px; display:grid; gap:6px}
.tk.thesis{background:var(--accent-soft); border-color:transparent}
.tk.thesis h3{color:var(--ink)}

/* legend, glyphs, chips */
.legend{display:flex; flex-wrap:wrap; gap:8px 16px; font-size:13px; color:var(--ink-2); margin:0; padding:0; list-style:none; align-items:center}
.legend li{display:flex; align-items:center; gap:7px}
.legend .lg-sep{padding-left:14px; border-left:1px solid var(--rule)}
.tz-key{width:22px; height:14px; border-radius:5px; box-shadow:inset 0 0 0 2px var(--tz-line); background-image:repeating-linear-gradient(135deg,var(--tz-hatch) 0 2px,transparent 2px 7px)}
.vg{width:9px; height:9px; flex:none; display:inline-block; border-radius:50%}
.vg.works{background:currentColor}
.vg.partial{background:linear-gradient(90deg,currentColor 50%,transparent 50%); box-shadow:inset 0 0 0 1.5px currentColor}
.vg.weak{box-shadow:inset 0 0 0 1.5px currentColor}
.vg.finding{border-radius:1px; transform:rotate(45deg) scale(.82); background:currentColor}
.vg.reference{border-radius:1px; transform:rotate(45deg) scale(.82); box-shadow:inset 0 0 0 1.5px currentColor}
.chip{position:relative; display:inline-flex; align-items:center; gap:6px; max-width:100%; font:500 12.5px/1.25 var(--sans); text-align:left; padding:4px 10px; border-radius:999px; cursor:pointer; border:1px solid; background:var(--surface)}
.chip .cn{min-width:0; overflow-wrap:break-word}
.mx.dense .chip{padding:3px 7px; gap:4px; font-size:11.5px}
.chip.p3{background:var(--strong-bg); color:var(--strong-ink); border-color:var(--strong-bg); font-weight:600}
.chip.p2{color:var(--ink); border-color:var(--ink-2)}
.chip.p1{color:var(--ink-2); border-color:var(--rule-2)}
.chip.sec{border-style:dashed; background:var(--surface)}
.chip.sec.p3{background:var(--surface-2); color:var(--ink); border-color:var(--ink)}
.chip.sec.p2{color:var(--ink-2); border-color:var(--muted)}
.chip.sec.p1{color:var(--muted); border-color:var(--rule-2)}
.chip:not(.p3):hover{border-color:var(--ink); background:var(--surface-2)}
.chip.p3:hover{border-color:var(--strong-bg); filter:brightness(1.15)}
.chip.demo{cursor:default; padding:2px 7px; font-size:12px}
.chip.flash,.n.flash{animation:flash 1.6s ease-out 1}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--hit)} 100%{box-shadow:0 0 0 0 transparent}}

/* filters */
.filters{display:flex; flex-wrap:wrap; gap:12px 24px; align-items:flex-end; padding:14px 18px; background:var(--surface); border:1px solid var(--rule); border-radius:20px}
.filters fieldset{border:0; margin:0; padding:0; min-width:0}
.filters legend{font:600 12.5px/1.4 var(--sans); color:var(--muted); padding:0; margin-bottom:6px}
.seg{display:flex; flex-wrap:wrap; gap:4px}
.seg input{position:absolute; opacity:0; width:1px; height:1px}
.seg label{font:500 13px/1 var(--sans); padding:8px 12px; border-radius:999px; border:1px solid transparent; color:var(--ink-2); cursor:pointer; background:var(--surface-2)}
.seg label:hover{border-color:var(--rule-2)}
.seg input:checked + label{background:var(--strong-bg); border-color:var(--strong-bg); color:var(--strong-ink); font-weight:600}
.seg input:focus-visible + label{outline:2px solid var(--accent); outline-offset:2px}
.fcount{margin:0 0 0 auto; display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.fcount strong{font:600 20px/1 var(--display); color:var(--ink)}

/* matrix */
.mx-wrap{position:relative; overflow:auto; max-height:84vh; border:1px solid var(--rule); border-radius:20px; background:var(--surface)}
table{border-collapse:separate; border-spacing:0; width:100%}
.mx{font-size:13px; table-layout:fixed}
.mx th,.mx td{border-bottom:1px solid var(--rule); border-right:1px solid var(--rule); vertical-align:top; text-align:left}
.mx tr > :last-child{border-right:0}
.mx thead th{background:var(--surface-2); padding:10px 9px 9px; position:sticky; top:0; z-index:2}
.mx thead .corner{left:0; z-index:4; font:600 12px/1.3 var(--sans); color:var(--muted); width:15.5rem; vertical-align:bottom}
.mx.dense thead .corner{width:12rem}
th.ch{border-top:3px solid var(--c) !important; cursor:pointer}
th.ch:hover{background:var(--accent-soft) !important}
.ch-wt{--c:var(--st-wt)} .ch-tr{--c:var(--st-tr)} .ch-rc{--c:var(--st-rc)} .ch-dc{--c:var(--st-dc)}
.ch .stg{display:block; font:700 11.5px/1.3 var(--sans); color:var(--ink-2)}
.ch .cnm{display:block; font:700 14px/1.25 var(--sans); color:var(--ink); margin-top:2px}
.ch .cs{display:block; font-size:11.5px; line-height:1.35; color:var(--muted); margin-top:3px; font-weight:400}
.pin{display:inline-flex; align-items:center; gap:3px; margin-top:5px; font:600 11.5px/1 var(--sans); color:var(--accent)}
.pin svg{width:11px; height:11px; fill:none; stroke:currentColor; stroke-width:2}
.mx .tot{width:3.8rem; text-align:right; color:var(--muted); font:500 12.5px/1.3 var(--sans); font-variant-numeric:tabular-nums; padding:10px 9px; background:var(--surface)}
.mx thead .tot{background:var(--surface-2); vertical-align:bottom}
.rh{position:sticky; left:0; z-index:1; background:var(--surface); padding:10px 12px; font-weight:400; cursor:pointer}
.rh:hover{background:var(--accent-soft)}
.rh .rid{font:600 11.5px/1 var(--sans); color:var(--muted)}
.rh .rn{font:700 14px/1.3 var(--sans); color:var(--ink)}

/* closest papers */

.dg-l{font:600 12.5px/1.4 var(--sans); color:var(--muted); margin:0 0 3px}

/* family / input / operation list */
.fl{background:var(--surface); border:1px solid var(--rule); border-radius:20px; overflow:hidden}

@media (max-width:900px){
  .fl-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .fl-head{display:none}
  .fl-t .fl-l{display:block; font:600 12px/1.4 var(--sans); color:var(--muted); margin:0 0 2px}
}
@media (max-width:600px){ .fl-row{grid-template-columns:1fr} }

/* coding grid */
.two{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:18px; align-items:start}
.two.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

@media (max-width:1000px){ .three{grid-template-columns:1fr} }
.tbl-wrap{position:relative; overflow-x:auto; border:1px solid var(--rule); border-radius:20px; background:var(--surface); min-width:0}

.gt tr.grp th{background:var(--surface-2); font:700 12.5px/1.3 var(--sans); color:var(--ink-2)}

.stg-t{font:700 11.5px/1 var(--sans); color:var(--ink-2)}
.rule-box{position:relative; background:var(--surface); border:1px solid var(--rule); border-radius:20px; padding:18px 20px; display:grid; gap:8px}
.rule-box .edit-pen{position:absolute; right:8px; top:8px}

/* ---------- map ---------- */
#view-map{position:relative; height:calc(100dvh - var(--hdr-h) - var(--bar-h,0px) - env(safe-area-inset-top,0px)); min-height:420px}
.viewport{position:absolute; inset:0; overflow:hidden; touch-action:none; background-color:var(--bg); background-image:radial-gradient(var(--map-dot) 1px,transparent 1.2px); cursor:grab; user-select:none; -webkit-user-select:none}

.world{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform}
.world.animate{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.edges{position:absolute; left:0; top:0; overflow:visible; pointer-events:none}
.edges path{fill:none; stroke:var(--edge); stroke-width:1.25; vector-effect:non-scaling-stroke; stroke-linejoin:round}
.edges path.ah{fill:var(--edge); stroke:none}
.edges path.divider{stroke-dasharray:8 6; stroke:var(--rule-2)}
.edges path.hl{stroke:var(--sel); stroke-width:2.2}
.edges path.ah.hl{fill:var(--sel)}
.edges path.dim{opacity:.15}
/* v2: lanes × columns */
.edges path.tree{stroke:var(--edge); stroke-width:1.2}
.edges path.tree.hl{stroke:var(--sel); stroke-width:2.2}
.edges path.guide{stroke:var(--rule-2); stroke-dasharray:3 7; stroke-width:1}
.edges path.chainline{stroke:var(--ink-2); stroke-width:1.8}
.edges path.chainhead{fill:var(--ink-2); stroke:none}

.lane-lbl.sel{box-shadow:0 0 0 2px var(--sel), var(--shadow)}
.lane-lbl:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.lane-lbl .lk{display:flex; align-items:center; gap:6px; font:600 12px/1.2 var(--sans); color:var(--muted)}
.lane-lbl .ln{font:600 22px/1.1 var(--display); letter-spacing:-.01em}

.n.sub{box-shadow:0 0 0 2px color-mix(in srgb,var(--sel) 55%,transparent)}
.n-paper.dup{background-image:linear-gradient(135deg,transparent calc(100% - 14px),var(--pl) calc(100% - 14px))}
.n-paper .twin{font:600 10px/1.2 var(--sans); color:var(--muted)}
.lod-far .n-paper .twin{display:none}
.n-note{display:flex; flex-direction:column; gap:4px; font-size:12.5px; line-height:1.4; padding:10px 12px}
.n-note::after{display:none}
.n-note .nk{font:600 11px/1.2 var(--sans); color:var(--eyebrow)}

.n-note .nb{display:block; max-height:7.2em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 60%,transparent); mask-image:linear-gradient(#000 60%,transparent); color:var(--ink-2)}
.n-note .nb ul{padding-left:16px; margin:0}
.n-note .nb p{margin:0}
.n-note .more{font:600 11px/1 var(--sans); color:var(--accent)}
.lod-far .n-note .nb,.lod-far .n-note .more{display:none}
.lod-far .n-note{justify-content:center}
.dr .crumbs{display:flex; flex-wrap:wrap; gap:4px 6px; align-items:baseline; margin:0; font-size:13.5px}
.crumbs .sep{color:var(--muted)}
.crumbs button.go{all:unset; cursor:pointer; color:var(--accent)}

.crumbs button.go:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.sw.lanes{background:linear-gradient(var(--lane-exec) calc(50% - .5px), var(--rule-2) 0 calc(50% + .5px), var(--lane-orch) 0); border-color:var(--rule-2)}
.n{position:absolute; margin:0; text-align:left; font-family:var(--sans); color:var(--ink); overflow:hidden; transition:opacity .2s}
:where(button.n){cursor:pointer; padding:0}
button.n:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
.n.dim{opacity:.18}
.n.sel{box-shadow:0 0 0 2.5px var(--sel), var(--shadow-lg); z-index:3}

.n.hit{box-shadow:0 0 0 5px var(--hit)}
.n.added{outline:2px dashed var(--sel); outline-offset:3px}
.n-band{display:flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--rule-2); box-shadow:var(--shadow); border-radius:12px; font:700 14px/1.2 var(--sans); color:var(--ink)}
.n-chain{display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--strong-bg); border:0; border-radius:999px; font:600 19px/1.1 var(--display); color:var(--strong-ink); box-shadow:var(--shadow); padding:9px 18px}

.n-paper .pn{display:flex; align-items:center; gap:5px; font:700 12px/1.15 var(--sans); color:var(--ink)}

.n-paper .pn .pxd i.on{opacity:.85}
.n-paper .tx{font:400 9.5px/1.3 var(--sans); color:var(--ink-2); overflow:hidden}
.n-paper.ext .pn{font-weight:600}
.n-note{background:var(--note-bg); border:1px solid var(--rule); border-radius:14px; color:var(--ink-2); box-shadow:var(--shadow)}
.n-note h4,.md h4{font:700 13px/1.3 var(--sans); color:var(--ink); margin:10px 0 4px}
.n-note h4:first-child,.md h4:first-child{margin-top:0}
.n-note p,.md p{margin:0 0 6px}
.n-note ul,.md ul{margin:0 0 6px; padding-left:20px; display:grid; gap:4px}
.n-bib{display:flex; flex-direction:column; justify-content:center; gap:4px; padding:12px 16px; border-radius:16px; border:1px solid var(--rule-2); background:var(--surface); box-shadow:var(--shadow)}
.n-bib b{font:600 22px/1.1 var(--display)}
.n-bib span{font:500 12.5px/1.3 var(--sans); color:var(--accent)}
/* boxes in the indented lists read left to right; a root box heads its list, in its lane's colour */
.n-concept{align-items:flex-start; text-align:left; padding:6px 10px; font:500 12px/1.3 var(--sans)}
.n-concept.major{font:600 12.5px/1.25 var(--display)}
.n-concept.root{padding:10px 14px; border:1px solid var(--rule-2); border-radius:12px; font:600 16px/1.2 var(--display)}
:where(.n-concept.root){box-shadow:var(--shadow-card)}
/* the deeper a section sits, the darker its box, in both themes: (near) white at the top of a list, then light grey,
   mid grey, near black */
.n-concept.d1,.n-concept.d2,.n-concept.d3,.n-concept.d4{border-color:transparent}
.n-concept.d0,.n-band{background:var(--sec-0); color:var(--sec-0-ink)} .n-concept.d0 .s{color:var(--sec-0-sub)} .n-concept.d0.linked::after{background:var(--sec-0-dot)}
.n-concept.d1{background:var(--sec-1); color:var(--sec-1-ink)} .n-concept.d1 .s{color:var(--sec-1-sub)} .n-concept.d1.linked::after{background:var(--sec-1-dot)}
.n-concept.d2{background:var(--sec-2); color:var(--sec-2-ink)} .n-concept.d2 .s{color:var(--sec-2-sub)} .n-concept.d2.linked::after{background:var(--sec-2-dot)}
.n-concept.d3{background:var(--sec-3); color:var(--sec-3-ink)} .n-concept.d3 .s{color:var(--sec-3-sub)} .n-concept.d3.linked::after{background:var(--sec-3-dot)}

/* everything at the top of the categorisation shares the top-level colour: lanes, chain columns, bibliography, framing */
.lane-lbl,.n-chain,.n-bib,.n-frame{background:var(--sec-0); color:var(--sec-0-ink); border:1px solid var(--rule-2)}
.lane-lbl .lk,.lane-lbl .ld,.n-chain .stg{color:var(--sec-0-sub)}
.n-bib span{color:var(--sec-0-sub)}
.n-paper{box-shadow:var(--shadow)}
.n-band{justify-content:flex-start; padding:0 14px; font-size:13.5px}
.n-frame{justify-content:flex-start; text-align:left; font-size:17px; padding:10px 14px}
.cont{position:absolute; height:18px; padding-top:2px; font:600 11px/1.3 var(--sans); color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; pointer-events:none; transition:opacity .2s}

.areas{display:flex; flex-wrap:wrap; gap:6px}
/* zoomed-out: names only, larger */

.map-ui{position:absolute; z-index:5; display:flex; gap:6px}

.mlegend{display:grid; grid-template-columns:auto 1fr; gap:6px 10px; align-items:center; font-size:12.5px; color:var(--ink-2); margin:0}

.sw.chain{background:var(--sec-0); border-color:var(--rule-2); border-radius:999px}
.sw.q{position:relative; background:var(--q-bg); border-color:var(--q-line)}
.sw.q::before{content:"?"; position:absolute; left:2px; top:1px; width:10px; height:10px; border-radius:50%; background:var(--q-mark); color:var(--surface); font:800 7.5px/10px var(--sans); text-align:center}
.sw.note{border-color:var(--rule); box-shadow:var(--shadow); background:linear-gradient(var(--eyebrow),var(--eyebrow)) 3px 3px/8px 2px no-repeat, var(--note-bg)}
.sw.s-published{border-left:4px solid var(--pub-line)} .sw.s-lab-preprint{border-left:5px double var(--lab-line)}
.sw.s-preprint{border-left:4px dashed var(--pre-line)} .sw.s-workshop{border-left:4px dotted var(--ws-line)}
/* tall enough for the dashed and dotted edges to show, as on the map boxes */
.mlegend .sw.s-published,.mlegend .sw.s-lab-preprint,.mlegend .sw.s-preprint,.mlegend .sw.s-workshop{height:24px; width:18px; border-radius:2px 5px 5px 2px}
.cell-open{position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; padding:0}
.cell-open:focus-visible{position:static; width:auto; height:auto; margin:0 0 4px; clip-path:none; white-space:normal; display:block; font:500 11.5px/1.3 var(--sans); color:var(--accent); background:var(--accent-soft); padding:3px 6px; border-radius:5px; outline:2px solid var(--accent)}
.sw.dot{width:36px; position:relative; background:linear-gradient(90deg,var(--sec-0) 0 25%,var(--sec-1) 0 50%,var(--sec-2) 0 75%,var(--sec-3) 0)}
.sw.dot::after{background:var(--sec-3-dot) !important}
.sw.dot::after{content:""; position:absolute; top:2px; right:2px; width:5px; height:5px; border-radius:50%; background:var(--accent)}
.map-reopen{left:max(14px,env(safe-area-inset-left,0px)); top:14px}
.map-reopen .btn{box-shadow:var(--shadow)}
.map-fallback{position:absolute; inset:0; display:grid; place-items:center; padding:20px; text-align:center; color:var(--ink-2)}

/* ---------- side panel ---------- */
.drawer{position:fixed; z-index:45; top:calc(var(--hdr-h) + env(safe-area-inset-top,0px) + 12px); right:max(12px,env(safe-area-inset-right,0px)); bottom:12px; width:min(470px,calc(100% - 24px)); background:var(--surface); border:1px solid var(--rule); border-radius:24px; box-shadow:var(--shadow-lg); overflow:auto; overscroll-behavior:contain; padding:18px 22px 28px}
@media (max-width:760px){
  .drawer{top:auto; left:0; right:0; bottom:0; width:100%; max-height:74dvh; border-width:1px 0 0; border-radius:24px 24px 0 0; padding:16px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
}
.dr-top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:6px}
.dr-kicker{margin:0; font:600 13px/1.3 var(--sans); color:var(--muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.dr-kicker .dot{width:9px; height:9px; border-radius:50%; display:inline-block; border:1.5px solid}
.dr{display:grid; gap:14px}
.dr > *{min-width:0}
.dr h2{font:600 26px/1.15 var(--display); letter-spacing:-.012em; margin:0; text-wrap:balance}
.dr h2:focus{outline:none}
.ico{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:1.9; flex:none; vertical-align:-2px}
.dr .ttl{margin:0; font-size:14.5px}
.dr .ttl a{color:var(--ink); text-decoration-thickness:1px; text-underline-offset:3px}
.dr .meta{display:flex; flex-wrap:wrap; gap:4px 12px; font-size:13px; color:var(--muted); margin:0}
.dr p{margin:0; color:var(--ink-2); font-size:14.5px}
.dr .blk{display:grid; gap:3px}
.dr .quote{border-left:3px solid var(--rule-2); padding:4px 0 4px 12px; color:var(--ink-2); font-size:14px; white-space:pre-line}
.dr .md{font-size:14.5px; color:var(--ink-2)}
.dr .actions{display:flex; flex-wrap:wrap; gap:8px; padding-top:6px; border-top:1px solid var(--rule)}
.dr .actions .lbl{flex-basis:100%; font:600 12.5px/1.4 var(--sans); color:var(--muted); margin-top:10px}
.discard{border:1.5px solid var(--bad); background:var(--surface); border-radius:16px; padding:10px 12px; display:grid; gap:8px}
.discard p{margin:0; color:var(--ink); font-size:14px; font-weight:500}
.discard .row{display:flex; flex-wrap:wrap; gap:8px}
.btn.danger{background:var(--bad); border-color:var(--bad); color:var(--surface); font-weight:600}
.pend{font-size:13.5px; background:var(--accent-soft); color:var(--ink-2); padding:10px 12px; border-radius:12px; margin:0}
.linklist{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.linklist li{display:grid; gap:2px}
.linklist button.go{all:unset; cursor:pointer; display:flex; gap:8px; align-items:baseline; font-size:14px; color:var(--accent)}
.linklist button.go:hover{text-decoration:underline}
.linklist button.go:disabled{cursor:default; color:var(--muted); text-decoration:none}
.linklist button.go:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.linklist .why{font-size:13.5px; color:var(--ink-2)}
.linklist .tag{font:600 11.5px/1.6 var(--sans); color:var(--ink); white-space:nowrap; border:1px solid var(--rule-2); border-radius:999px; padding:0 8px}
.linklist .tag.sec{color:var(--muted); border-style:dashed}
.linklist .cnt{font:500 12.5px/1 var(--sans); font-variant-numeric:tabular-nums; color:var(--muted)}
.pl-grp{display:grid; gap:6px}
.pl-grp + .pl-grp{margin-top:6px}
.pl-head{font:700 12.5px/1.4 var(--sans); color:var(--ink); margin:0}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.rm{border:0; background:none; color:var(--muted); cursor:pointer; font-size:12px; padding:0 5px; border-radius:6px}
.rm:hover{color:var(--bad); background:var(--surface-2)}
.rm.edit:hover{color:var(--accent); background:var(--accent-soft)}

/* forms */
.form{display:grid; gap:12px}
.form .row2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
@media (max-width:480px){ .form .row2{grid-template-columns:1fr} }
.field{display:grid; gap:4px; min-width:0}
.field > label,.field > .lab{font:600 12px/1.3 var(--sans); color:var(--ink)}
.field .hint{font-size:12px; color:var(--muted)}
.np-row{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin-top:4px}
.field input,.field select,.field textarea,.rich{width:100%; font:14px/1.45 var(--sans); padding:10px 12px; border-radius:12px; border:1px solid var(--u1); background:var(--surface); color:var(--ink)}
.field textarea{min-height:76px; resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted); opacity:1}
.rich{min-height:90px; max-height:50vh; overflow:auto}
.rich:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent); outline-offset:0; border-color:var(--accent); background:var(--surface)}
.rich p{margin:0 0 6px} .rich ul{margin:0 0 6px; padding-left:20px}
.rich h4{font:700 13px/1.3 var(--sans); margin:6px 0 4px}
.rtools{display:flex; gap:4px}
.rtools button{font:600 12px/1 var(--sans); padding:6px 10px; border-radius:8px; border:1px solid var(--rule-2); background:var(--surface); cursor:pointer}
.radio-row{display:flex; flex-wrap:wrap; gap:12px; font-size:14px}
.radio-row label{display:flex; gap:6px; align-items:center}
.err{color:var(--bad); font-size:13.5px; margin:0}
.okmsg{color:var(--ok); font-size:13.5px; margin:0}
/* "Suggest a change": one step at a time */
html{scroll-padding-top:calc(var(--hdr-h) + var(--bar-h, 0px) + 12px)}
.wiz{max-width:780px; display:grid; gap:14px; margin-top:14px}
.wiz-steps{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px}
.wiz-steps li{display:flex; align-items:center; gap:10px; font:500 14px/1.2 var(--sans); color:var(--muted)}
.wiz-steps li:not(:last-child)::after{content:""; width:28px; height:1px; background:var(--rule-2)}
.wiz-steps button{all:unset; display:flex; align-items:center; gap:8px; cursor:pointer; border-radius:999px; min-height:32px}
.wiz-steps button:hover .lbl{text-decoration:underline}
.wiz-steps button:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
.wiz-steps .num{flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; border:1.5px solid var(--rule-2); font:600 13px/1 var(--sans); color:var(--muted)}
.wiz-steps li.now{color:var(--ink); font-weight:600}
.wiz-steps li.now .num{background:var(--strong-bg); border-color:var(--strong-bg); color:var(--strong-ink)}
.wiz-steps li.done{color:var(--ink-2)}
.wiz-steps li.done .num{border-color:var(--ink-2); color:var(--ink)}
.wiz-panel{display:grid; gap:14px}
.wiz-panel > *,.wiz-sum > *{min-width:0}
.wiz-panel h2{margin:0}
.wiz-of{display:block; font:600 12.5px/1.4 var(--sans); color:var(--muted); margin-bottom:2px}
/* main button first in the page order: on the right on wide screens, on top on phones */
.wiz-foot{display:flex; flex-direction:row-reverse; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding-top:14px; border-top:1px solid var(--rule)}
.wiz-foot-r{display:flex; flex-direction:row-reverse; gap:8px; flex-wrap:wrap; align-items:center}
.wiz-opts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.wiz-opt{display:grid; gap:4px; align-content:start; text-align:left; padding:14px 16px; border:1px solid var(--rule-2); border-radius:16px; background:var(--surface); color:var(--ink); cursor:pointer; font:inherit}
.wiz-opt:hover{border-color:var(--ink-2)}
.wiz-opt:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.wiz-opt[aria-expanded="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink)}
.wiz-opt b{font:600 15px/1.25 var(--sans)}
.wiz-opt span{font-size:13px; line-height:1.4; color:var(--muted)}
.wiz-more{margin:6px 0 0}
.wiz-help{display:grid; gap:8px; padding:14px 16px; border:1px solid var(--rule); border-radius:16px; background:var(--bg); font-size:14px; color:var(--ink-2)}
.wiz-help p{margin:0}
.wiz-help ul{margin:0; padding-left:20px; display:grid; gap:4px}
.wiz-help-go{display:flex; flex-wrap:wrap; gap:8px}
.wiz-sum{display:grid; gap:8px; padding:14px 16px; border:1px solid var(--rule); border-radius:16px; background:var(--bg)}
.wiz-sum-h{display:flex; justify-content:space-between; align-items:center; gap:8px}
.wiz-sum-h .dg-l{margin:0}
.wiz-list{margin:0; padding-left:20px; display:grid; gap:4px; font-size:14px; color:var(--ink-2)}
.wiz-list b{color:var(--ink); font-weight:600}
.wiz .quote{margin:0; border-left:3px solid var(--rule-2); padding:4px 0 4px 12px; color:var(--ink-2); font-size:14px; white-space:pre-line}
.wiz .quote,.wiz-sum .sec-p,.wiz-list{overflow-wrap:anywhere}
.wiz .small{font-size:13px}
.add-hint{margin:0; font-size:13px; color:var(--muted)}
.dr .badge-blk{padding:14px 16px; border:1px solid var(--rule); border-radius:16px; background:var(--bg); gap:8px}
.badge-blk img{display:block; height:20px; width:auto}
.code-snip{margin:0; padding:10px 12px; border-radius:10px; background:var(--surface); border:1px solid var(--rule); font:12px/1.45 var(--code); white-space:pre-wrap; overflow-wrap:anywhere; color:var(--ink-2)}
.badge-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.copied{font-size:13px; color:var(--ok)}
.brand .bn-s{display:none}
@media (max-width:700px){ .wiz-opts{grid-template-columns:1fr} .wiz-steps .lbl{font-size:13px} .wiz-steps li:not(:last-child)::after{width:14px} }
/* phones: the three circles stay on one line (only the current step is named), buttons stack, main one on top */
@media (max-width:520px){
  .wiz-steps{flex-wrap:nowrap}
  .wiz-steps li:not(.now) .lbl{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
  .wiz-steps li:not(:last-child)::after{width:20px}
  .wiz-foot,.wiz-foot-r{flex-direction:column; align-items:stretch}
  .wiz-foot .btn{justify-content:center}
}
.hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}

/* papers view */
.plist-tools{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:flex-end}
.plist-tools .field{min-width:150px}
.plist-tools .grow{flex:1 1 240px}
.ptab{min-width:860px; font-size:13.5px}
.ptab th,.ptab td{padding:9px 10px; border-bottom:1px solid var(--rule); text-align:left; vertical-align:top}
.ptab thead th{position:sticky; top:0; background:var(--surface-2); font:600 12px/1.4 var(--sans); color:var(--muted); z-index:1}
.ptab thead button{all:unset; cursor:pointer}
.ptab thead button:hover{color:var(--ink)}
.ptab thead button:focus-visible{outline:2px solid var(--accent)}
.ptab tbody tr{cursor:pointer}
.ptab tbody tr:hover td{background:var(--surface-2)}
.ptab .pt{font:700 14px/1.3 var(--sans); color:var(--ink)}
.ptab .ps{font-size:12.5px; color:var(--muted); margin-top:2px}
.ptab td.c{white-space:nowrap; color:var(--ink-2)}
.st-dot{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; border:1.5px solid}
.st-dot.s-published{background:var(--pub-line); border-color:var(--pub-line)} .st-dot.s-lab-preprint{background:var(--lab-bg); border-color:var(--lab-line)}
.st-dot.s-preprint{background:var(--pre-bg); border-color:var(--pre-line); border-style:dashed} .st-dot.s-workshop{background:var(--ws-bg); border-color:var(--ws-line); border-style:dotted}
.ptab .onmap{font:600 11.5px/1 var(--sans); color:var(--accent)}

/* suggestions view */
.contrib{display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:22px; align-items:start}
@media (max-width:900px){ .contrib{grid-template-columns:1fr} }
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:24px; padding:20px 22px; display:grid; gap:12px; min-width:0}
.panel h2{font:600 23px/1.2 var(--display); letter-spacing:-.01em; margin:0}
.steps{margin:0; padding-left:20px; display:grid; gap:6px; color:var(--ink-2); font-size:14.5px}
.chg{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.chg li{border:1px solid var(--rule); border-radius:16px; padding:12px 14px; display:grid; gap:6px; background:var(--bg)}
.chg .h{display:flex; gap:8px; align-items:baseline; justify-content:space-between}
.chg .a{font:700 12.5px/1.3 var(--sans); color:var(--eyebrow)}
.chg .tg{font-size:14px; color:var(--ink); font-weight:600}
.chg .f{font-size:12.5px; color:var(--muted)}
.diff{display:grid; gap:4px; font-size:13px}
.diff .b,.diff .af{padding:7px 10px; border-radius:10px; white-space:pre-wrap; overflow-wrap:anywhere; max-height:150px; overflow:auto}
.diff .b{background:color-mix(in srgb,var(--bad) 10%,transparent); color:var(--ink-2); text-decoration:line-through; text-decoration-color:color-mix(in srgb,var(--bad) 55%,transparent)}
.diff .af{background:color-mix(in srgb,var(--ok) 12%,transparent); color:var(--ink)}
.empty-state{border:1.5px dashed var(--rule-2); border-radius:18px; padding:16px; color:var(--ink-2); font-size:14px; display:grid; gap:8px}
.toggle{display:flex; gap:8px; align-items:center; font-size:14px}
.prlist{list-style:none; margin:0; padding:0; display:grid; gap:6px; font-size:14px}
.prlist .prn{font:600 12.5px/1 var(--sans); font-variant-numeric:tabular-nums; color:var(--muted); margin-right:6px}

/* toast */
.toast{position:fixed; z-index:70; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); display:flex; gap:12px; align-items:center; background:var(--ink); color:var(--bg); padding:10px 12px 10px 18px; border-radius:16px; font-size:14px; box-shadow:var(--shadow-lg); max-width:calc(100% - 32px)}
.toast .btn{background:transparent; color:var(--bg); border-color:color-mix(in srgb,var(--bg) 40%,transparent)}
.preview-bar{position:sticky; top:calc(var(--hdr-h) + env(safe-area-inset-top,0px)); z-index:20; background:var(--strong-bg); color:var(--strong-ink); font-size:13.5px; padding-block:7px; display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap}
.preview-bar .btn{background:transparent; color:var(--strong-ink); border-color:color-mix(in srgb,var(--strong-ink) 50%,transparent)}
@media (max-width:760px){ body.on-map .drawer{max-height:52dvh} }
@media (max-width:374px){ .tabs a{padding-inline:6px} }
/* the name on small screens: smaller, then without "Awesome", then the short form; the button keeps only its + */
@media (max-width:600px){ .brand a{font-size:18px} .brand a .ch{display:none} }
@media (max-width:430px){ .brand .bn-l{display:none} .brand .bn-s{display:inline} }
@media (max-width:350px){ .tools .np-s{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap} #np-btn{padding-inline:12px} }
/* the zoom buttons move clear of the open panel */
@media (min-width:761px){ body.on-map:has(#drawer:not([hidden])) .map-zoom{right:calc(max(12px,env(safe-area-inset-right,0px)) + min(470px,100% - 24px) + 14px)} }
@media (max-width:760px){ body.on-map:has(#drawer:not([hidden])) .map-zoom{top:14px; bottom:auto} body.on-map:has(#drawer:not([hidden])) .map-help{display:none} }
@media (pointer:coarse){
  .u{width:26px; height:26px} .units{gap:2px}
  .rm,.edit-pen{min-width:28px; min-height:28px; padding:5px 7px}
}
/* cards everywhere: one shape (last, so it wins over each component's own border) */
.tk,.card,.filters,.mx-wrap,.fl,.tbl-wrap,.rule-box,.panel{border-color:transparent; border-radius:18px; box-shadow:var(--shadow-card)}
@media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important} }
</style>

<header class="top gut" id="top">
  <div class="top-in wrap wide">
    <div class="brand">
      <a href="#map"><span class="ch">Awesome </span><span class="bn-l">Agentic Capacity Planning</span><span class="bn-s">Capacity Planning</span></a>

    </div>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>

</header>
<div class="preview-bar gut" id="preview-bar" hidden></div>

<main id="main" tabindex="-1">
  <section class="view" id="view-map" aria-label="Map" hidden>
    <div class="map-ui map-zoom" role="group" aria-label="Zoom">
      <button class="icon-btn" type="button" id="z-in" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="zl num" id="z-level">100%</div>

      <button class="icon-btn x" type="button" id="help-x" aria-label="Hide the guide"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <h2 id="help-title">How to read the map</h2>

      <div id="map-areas"></div>

    <div class="viewport" id="viewport"><div class="world" id="world"></div></div>

      if (String(txt).toLowerCase().includes(s)) items.push({ k: { question: 'Open question', note: 'Map notes', chain: 'Chain link', group: 'Map area', framing: 'Framing', bib: 'Bibliography' }[n.kind] || 'Map concept', t: n.kind === 'note' ? clipText(nodeTitle(n) + ': ' + plain(n.html), 90) : clipText(txt, 90), run: () => (n.kind === 'bib' ? go('papers') : goNode(n.id)) });

    S.data.matrices.forEach(m => { const t = S.I.t[m.sections.find(x => x.type === 'matrix').table]; t.groups.forEach(g => g.rows.forEach(r => { if ((r.name + ' ' + r.desc).toLowerCase().includes(s)) items.push({ k: m.nav + ' · row', t: rowLabel(t.id, r.id), run: () => goAxis(t.id, 'row', r.id) }); })); t.cols.forEach(c => { if ((c.name + ' ' + c.sub).toLowerCase().includes(s)) items.push({ k: m.nav + ' · column', t: c.stage + ' ' + c.name, run: () => goAxis(t.id, 'col', c.id) }); }); });
    const total = items.length;
    items = items.slice(0, 14); on = 0; draw();
    res.hidden = false; q.setAttribute('aria-expanded', 'true');
    count.textContent = total ? `${total} result${total > 1 ? 's' : ''}${total > items.length ? `, first ${items.length} shown` : ''}. Use the arrow keys and Enter.` : 'No match.';
  });
  q.addEventListener('keydown', e => {
    if (res.hidden) return;
    if (e.key === 'ArrowDown') { on = Math.min(items.length - 1, on + 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { on = Math.max(0, on - 1); draw(); e.preventDefault(); }
    else if (e.key === 'Enter' && items[on]) { pick(items[on]); e.preventDefault(); }
    else if (e.key === 'Escape') { close(); e.stopPropagation(); }
  });
  q.addEventListener('blur', e => { if (!e.relatedTarget || !res.contains(e.relatedTarget)) setTimeout(close, 150); });
}

/* ---------- boot ---------- */
const RENDER = { map: renderMap, m1: () => renderMatrixPage('m1'), m2: () => renderMatrixPage('m2'), m3: () => renderMatrixPage('m3'), papers: renderPapers, suggest: renderSuggest };
function initGlobal() {
  document.addEventListener('click', e => {
    if (e.target.closest('[contenteditable]')) return; // links inside an editor are text being edited
    const r = e.target.closest('.ref[data-p], .chip[data-p], .u[data-p]');
    if (r && !r.classList.contains('demo') && P(r.dataset.p)) { e.preventDefault(); select({ type: 'paper', id: r.dataset.p }); }
  });
  $('#dr-x').onclick = () => guard(() => closeDrawer());
  { const body = $('#dr-body'), add = body.append.bind(body); body.append = (...xs) => add(...xs.filter(x => x != null && x !== false)); }
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape' || e.defaultPrevented || e.isComposing || $('#drawer').hidden || e.target.closest('.search')) return;
    const bar = $('#discard-bar');
    if (bar) { bar.querySelector('.btn').click(); return; } // Escape on the question means "keep editing"
    guard(() => closeDrawer());
  });
  window.addEventListener('hashchange', () => route(true));
  // the steps of "Suggest a change" share one address: Back and Forward move between them
  window.addEventListener('popstate', e => {
    const at = parseHash();
    if (S.view !== 'suggest' || at.view !== 'suggest' || at.sel || S.sending) return;
    const k = (e.state && e.state.sgStep) || 1;
    if (k === S.sgStep) return;
    S.sgStep = k; S.sgHelp = false; rerender(false); focusWizard();
  });
  // keep pending suggestions in step when the site is open in several tabs
  window.addEventListener('storage', e => {
    if (e.key !== STORE_KEY || !S.base || e.newValue === e.oldValue) return;
    const was = JSON.stringify(S.basket);
    syncBasket();
    if (JSON.stringify(S.basket) === was) return;
    recompute(); rerender(S.preview);
  });
  const theme = store.get('wtrc-theme', null);
  if (theme) document.documentElement.dataset.theme = theme;
  const tb = $('#theme-btn');
  const syncTheme = () => tb.setAttribute('aria-pressed', String(document.documentElement.dataset.theme === 'dark'));
  syncTheme();
  $('#np-btn').onclick = () => { if (S.eff) select({ type: 'new', id: 'paper' }); };
  tb.onclick = () => {
    const dark = document.documentElement.dataset.theme === 'dark';
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    store.set('wtrc-theme', document.documentElement.dataset.theme);
    syncTheme();
  };
  const setH = () => document.documentElement.style.setProperty('--hdr-h', $('#top').getBoundingClientRect().height + 'px');
  new ResizeObserver(setH).observe($('#top')); setH();
  const bar = $('#preview-bar');
  new ResizeObserver(() => document.documentElement.style.setProperty('--bar-h', bar.hidden ? '0px' : bar.getBoundingClientRect().height + 'px')).observe(bar);
}
function bootError(title, text) {
  const box = $('#boot') || $('#main').appendChild(h('div', { id: 'boot', class: 'gut', style: 'padding-block:40px' }));
  VIEWS.forEach(v => { $('#view-' + v).hidden = true; });
  box.textContent = '';
  box.append(h('div', { class: 'wrap' }, h('h1', { text: title }), h('p', { class: 'lede', text })));
}
async function boot() {
  initGlobal();
  try {
    const res = await fetch(CFG.dataUrl, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    S.base = await res.json();
  } catch (e) {
    bootError('The data could not be loaded', location.protocol === 'file:' ? 'Browsers block data files on pages opened straight from the disk. Publish the folder (GitHub Pages, Netlify…) or run “python -m http.server” in it and open http://localhost:8000.' : `data.json did not load (${e.message}). Check that it sits next to index.html.`);
    return;
  }
  try {
    const saved = store.get(STORE_KEY, null);
    if (saved && Array.isArray(saved.basket)) { S.basket = saved.basket.filter(b => b && b.change && typeof b.change === 'object'); try { S.preview = sessionStorage.getItem('wtrc-preview') === '1'; } catch { S.preview = false; } S.tmpN = saved.tmpN || 0; }
    recompute();
    if (S.basketError) { S.preview = false; recompute(); }
    const sub = $('#brand-sub'); if (S.data.meta && S.data.meta.subtitle) { sub.textContent = S.data.meta.subtitle; sub.title = S.data.meta.subtitle; }
    initMapInput(); initSearch(); renderPreviewBar();
    route();
    $('#boot').remove();
  } catch (e) {
    console.error(e);
    bootError('The page could not be displayed', `Something in data.json is inconsistent (${e.message}). The maintainer can run “node tools/check-data.js” to find it.`);
  }
}
boot();
