// IPv6 addresses written in short form still group by subscriber
codes = [];
for (const ip of ['2001:db8::1:2:3:4', '2001:db8::9:2:3:4', '2001:db8:0:0:5::1', '2001:db8::7:0:0:1']) codes.push((await send({ ...base, changes: [{ type: 'comment', text: 'v6 ' + ip }] }, { ip, envOver: { MAX_PER_HOUR: '3' } })).status);
check('compressed IPv6 in one /56 share a limit', codes.slice(0, 3).every(c => c === 200) && codes[3] === 429, codes);
r = await send({ ...base, changes: [{ type: 'comment', text: 'hello there' }] }, { envOver: { GITHUB_TOKEN: '' } });
check('missing token gives a clear 503', r.status === 503 && /not configured/.test(r.body.error), r.body);

// anti-spam and allowed sites are required on the real worker
const live = { DEV_ALLOW_UNSAFE: '' };
const pulls0 = gh.pulls.length;
r = await send({ ...base, changes: [{ type: 'comment', text: 'no turnstile configured' }] }, { envOver: live });
check('no Turnstile secret: refused with 503', r.status === 503 && /anti-spam/.test(r.body.error) && gh.pulls.length === pulls0, r.body);
r = await send({ ...base, changes: [{ type: 'comment', text: 'no allowed origins' }] }, { envOver: { ...live, ALLOWED_ORIGINS: '', TURNSTILE_SECRET: 's' } });
check('empty ALLOWED_ORIGINS: every site refused (403)', r.status === 403, r.body);
r = await send({ ...base, changes: [{ type: 'comment', text: 'dev flag set to something else' }] }, { envOver: { DEV_ALLOW_UNSAFE: 'true' } });
check('DEV_ALLOW_UNSAFE only works with the exact value "1"', r.status === 503, r.body);
const ts = { ...live, TURNSTILE_SECRET: 's' };
r = await send({ ...base, turnstile: 'good', changes: [{ type: 'comment', text: 'solved on our site' }] }, { envOver: ts });
check('Turnstile solved on this site for a suggestion: accepted', r.status === 200, r.body);
await bad('Turnstile missing: rejected', { ...base, changes: [{ type: 'comment', text: 'hello there' }] }, /anti-spam/, { envOver: ts });
await bad('Turnstile failed: rejected', { ...base, turnstile: 'wrong', changes: [{ type: 'comment', text: 'hello there' }] }, /anti-spam/, { envOver: ts });
await bad('Turnstile solved on another site: rejected', { ...base, turnstile: 'otherhost', changes: [{ type: 'comment', text: 'hello there' }] }, /anti-spam/, { envOver: ts });
await bad('Turnstile solved for another form: rejected', { ...base, turnstile: 'otheraction', changes: [{ type: 'comment', text: 'hello there' }] }, /anti-spam/, { envOver: ts });
await bad('Turnstile without the suggest action: rejected', { ...base, turnstile: 'noaction', changes: [{ type: 'comment', text: 'hello there' }] }, /anti-spam/, { envOver: ts });

// "[skip ci]" in a visitor's text cannot switch off the checks
r = await send({ ...base, reason: 'Testing [skip ci] in the reason, and skip-checks: true too.', changes: [{ type: 'comment', target: '[skip ci] [ci skip] [skip actions]', text: 'hello [no ci] there' }] });
const prT = gh.pulls.at(-1);
check('no "[skip ci]" in the commit message, PR title or PR body', r.status === 200 && !/[[\]]/.test(lastCommit().message) && !/[[\]]/.test(prT.title)
  && !/\[(skip|ci|no|actions)/i.test(prT.body) && !/skip-checks/i.test(prT.body) && /skip ci/.test(prT.title), { title: prT.title, msg: lastCommit().message });

// tags must be closed, in order, and links must have text
await bad('unclosed link rejected', { ...base, changes: [{ type: 'text.update', path: 'matrices/0/lede', value: data.matrices[0].lede + ' Data in <a href="https://evil.example/dl">the replication package' }] }, /not closed/);
await bad('wrong closing order rejected', { ...base, changes: [{ type: 'text.update', path: 'matrices/0/lede', value: 'A <b><i>mix</b></i> here.' }] }, /order/);
await bad('stray closing tag rejected', { ...base, changes: [{ type: 'text.update', path: 'matrices/0/lede', value: 'A stray </b> here.' }] }, /does not match/);
await bad('link inside a link rejected', { ...base, changes: [{ type: 'text.update', path: 'matrices/0/lede', value: 'See <a href="https://a.example">one <a href="https://b.example">two</a></a>.' }] }, /another link/);
await bad('link without text rejected', { ...base, changes: [{ type: 'text.update', path: 'matrices/0/lede', value: 'See <a href="https://a.example"><b> </b></a> here.' }] }, /no text/);
await bad('closing </br> rejected', { ...base, changes: [{ type: 'text.update', path: 'matrices/0/lede', value: 'Line<br></br>break' }] }, /no closing tag/);
const noteId = data.map.nodes.find(n => n.kind === 'note').id;
await bad('list item outside a list rejected', { ...base, changes: [{ type: 'node.update', id: noteId, html: '<li>alone</li>' }] }, /inside <ul> or <ol>/);
const okNest = CORE.apply(data, [{ type: 'text.update', path: 'matrices/0/lede', value: 'Nested <b><i>bold italic</i></b> and <a href="https://example.org/a?x=1&amp;y=2">a link</a>.' }]);
check('well-formed nested tags accepted', okNest.log.length === 1);

// every text already on the site still passes the stricter rules
const failures = [];
const walk = (o, path) => {
  if (typeof o === 'string') {
    if (CORE.TEXT_PATHS.some(re => re.test(path)) && !CORE.isPlainPath(path)) {
      try { CORE.apply(data, [{ type: 'text.update', path, value: o + ' x' }]); } catch (e) { failures.push(path + ': ' + e.message); }
    }
    return;
  }
  if (o && typeof o === 'object') for (const [k, v] of Object.entries(o)) walk(v, path ? path + '/' + k : k);
};
walk(data, '');
for (const n of data.map.nodes.filter(x => x.kind === 'note')) {
  try { CORE.apply(data, [{ type: 'node.update', id: n.id, html: n.html + ' x' }]); } catch (e) { failures.push('note ' + n.id + ': ' + e.message); }
}
check('existing texts and notes pass the closed-tag rules', failures.length === 0, failures.slice(0, 3));

// the worker refuses the owner's token and a token with more rights than public_repo
r = await send({ ...base, changes: [{ type: 'comment', text: 'owner token' }] }, { envOver: { GITHUB_TOKEN: 'OWNERTOKEN' } });
check('owner token refused (503), nothing created', r.status === 503 && /robot account/.test(r.body.error), r.body);
r = await send({ ...base, changes: [{ type: 'comment', text: 'broad token' }] }, { envOver: { GITHUB_TOKEN: 'BROADTOKEN' } });
check('token with extra scopes refused (503)', r.status === 503 && /too many rights/.test(r.body.error), r.body);
r = await send({ ...base, changes: [{ type: 'comment', text: 'revoked token' }] }, { envOver: { GITHUB_TOKEN: 'REVOKED' } });
check('refused token gives a clear 503', r.status === 503 && /token refused/.test(r.body.error), r.body);

// a link's target is shown first and in full, even behind a long text with a decoy
const decoy = 'the replication package (→ https://zenodo.org/records/123456) ' + 'and more words '.repeat(14);
r = await send({ ...base, changes: [{ type: 'text.update', path: 'matrices/0/lede', value: data.matrices[0].lede + ' Source: <a href="https://evil.example/dl">' + decoy.trim() + '</a>. ' + 'Padding text. '.repeat(120) }] });
const lb = gh.pulls.at(-1).body;
check('changed link target listed in full before the details', r.status === 200 && lb.indexOf('https://evil.example/dl') > -1 && lb.indexOf('https://evil.example/dl') < lb.indexOf('### Changes') && /sites: evil\.example/.test(lb), lb.slice(0, 400));
await bad('link text over 300 characters rejected', { ...base, changes: [{ type: 'text.update', path: 'matrices/0/lede', value: 'See <a href="https://e.example">' + 'x'.repeat(301) + '</a>.' }] }, /300 characters/);
await bad('invisible link text rejected', { ...base, changes: [{ type: 'text.update', path: 'matrices/0/lede', value: 'See <a href="https://e.example">&#8203;</a> here.' }] }, /no text/);
await bad('paper link with a user name rejected', { ...base, changes: [{ type: 'paper.update', id: 'p039', fields: { url: 'https://arxiv.org:443@evil.example/abs/2401.00001' } }] }, /user name/);
r = await send({ ...base, changes: [{ type: 'paper.update', id: 'p039', fields: { url: 'https://evil.example/paper' } }] });
check('changed paper link listed under Links changed', r.status === 200 && /Links changed \(sites: evil\.example\)/.test(gh.pulls.at(-1).body), gh.pulls.at(-1).body.slice(0, 300));
const bidi = CORE.apply(data, [{ type: 'comment', text: 'abc‮def​ghi' }]);
check('direction and zero-width characters removed', bidi.log[0].after === 'abcdefghi', bidi.log[0].after);

// configuration helpers
r = await send({ ...base, changes: [{ type: 'comment', text: 'site written with its path' }] }, { envOver: { ALLOWED_ORIGINS: 'https://me.github.io/map/' } });
check('ALLOWED_ORIGINS entry with the project path still works', r.status === 200, r.body);
r = await send(null, { method: 'OPTIONS', origin: 'https://evil.example' });
check('refused site gets no CORS permission (not the literal null)', r.status === 204 && r.acao === null, r);
r = await send({ ...base, turnstile: 'badsecret', changes: [{ type: 'comment', text: 'hello there' }] }, { envOver: ts });
check('wrong Turnstile secret reported as a configuration error (503)', r.status === 503 && /anti-spam key/.test(r.body.error), r.body);
r = await send(null, { method: 'GET' });
check('health check shows sites, anti-spam and test mode', r.status === 200 && Array.isArray(r.body.allowedSites) && r.body.allowedSites[0] === 'https://me.github.io' && r.body.unsafeTestMode === true && r.body.token === true, r.body);

// the awesome list (README.md) follows data.json in the same pull request
r = await send({ ...base, changes: [{ type: 'paper.update', id: 'p039', fields: { venue: 'arXiv 2026 (v3)' } }] });
const rm = lastFile('README.md');
check('a change to the data also rewrites README.md, generated from the new data', r.status === 200 && rm === CORE.readme(lastData()) && rm.includes('arXiv 2026 \\(v3\\)'), rm && rm.slice(0, 120));
r = await send({ ...base, changes: [{ type: 'comment', text: 'just a remark on the list' }] });
check('a comment alone does not touch README.md', r.status === 200 && lastFile('README.md') === null && lastFile('data.json') === null);
const evil = { short: 'Evil [click](https://evil.example) <img src=x onerror=alert(1)>', title: '![x](https://evil.example/t.png) Title @someone www.evil.example', venue: '# Heading | table', url: 'https://ok.example/paper_(v2)', status: 'preprint', proximity: 2, evidence: 'testbed', verdict: 'works', does: 'See https://evil.example now. More text.', keyResult: '', whyProximity: '', gap: '', limitation: '' };
r = await send({ ...base, changes: [{ type: 'paper.add', tmp: 'new:1', paper: evil }] });
const rm2 = lastFile('README.md') || '';
const line = rm2.split('\n').find(l => l.includes('Evil')) || '';
check('visitor text in README.md stays text: no link, image, HTML, heading or auto-link', r.status === 200
  && !/\]\(https:\/\/evil/.test(line) && !/!\[/.test(line.replace(/\\!\\\[/g, '')) && !/(^|[^\\])<img/.test(line) && !/https:\/\/evil/.test(line)
  && /\\\[click\\\]/.test(line) && /ok\.example\/paper_%28v2%29/.test(line), line);
const t0r = performance.now(); for (let i = 0; i < 5; i++) CORE.readme(data); const msR = (performance.now() - t0r) / 5;
check('README generation is quick enough for the worker (under 8 ms)', msR < 8, { ms: Math.round(msR * 10) / 10 });
// more text that must stay text, and anchors that match GitHub's
{
  const dd = JSON.parse(original);
  dd.papers.p039.title = 'Serving $k$ agents x_www.evil.example a@-evil.com';
  const q = dd.map.nodes.find(n => n.kind === 'question'); q.text = '- looks like a list';
  dd.tables.m1.cols[0].sub = '1. GPU first';
  dd.tables.m1.cols[1].name = '🧭 Inference';
  const md2 = CORE.readme(dd), L = md2.split('\n');
  const pline = L.find(l => l.includes('Serving \\$k')) || '';
  check('no math, auto-link or e-mail link from visitor text', /\\\$k\\\$/.test(pline) && !/(^|[^​])www\.evil/.test(pline.replace(/www​\./g, '')) && pline.includes('@​-evil') && !/[^\\]\$k/.test(pline), pline.slice(0, 160));
  check('text at the start of a line never becomes a list', L.includes('1\\. GPU first') && L.some(l => l.startsWith('- \\- looks like a list')), L.filter(l => /GPU first|looks like a list/.test(l)));
  check('contents anchors follow GitHub (emoji dropped, its space kept)', md2.includes('](#-inference-tr)') && L.includes('## 🧭 Inference \\(T→R\\)'), L.filter(l => /Inference/.test(l)).slice(0, 2));
  check('no totals in the README (merges of two suggestions stay exact)', !/\*\*\d+ papers\*\*/.test(md2) && !/\d+ papers\./.test(md2));
}
// the whole CPU-bound path of one data suggestion (parse, apply, format, README) against the 10 ms of the free plan
const cpuPath = () => { const dd = JSON.parse(original); const res = CORE.apply(dd, [{ type: 'paper.update', id: 'p039', fields: { venue: 'arXiv 2026 (cpu)' } }]); CORE.format(res.data); CORE.readme(res.data); };
const c0 = performance.now(); cpuPath(); const cold = performance.now() - c0;
const w0 = performance.now(); for (let i = 0; i < 5; i++) cpuPath(); const warm = (performance.now() - w0) / 5;
check('whole CPU path of a data suggestion stays under 8 ms once warm', warm < 8, { coldMs: Math.round(cold * 10) / 10, warmMs: Math.round(warm * 10) / 10 });

const fails = R.filter(l => l.startsWith('FAIL')).length;
out.textContent = `${R.length - fails} passed, ${fails} failed\n\n` + R.join('\n') + '\n\nExample PR body:\n' + pr1.body;
window.__done = R;
</script>
